name: Build Hermes Desktop Light and publish APT

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'docs/**'
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Optional upstream release tag (blank = latest stable)'
        required: false
        type: string
      force:
        description: 'Rebuild tag already released by this project'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hermes-desktop-light-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Resolve upstream stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh api repos/NousResearch/hermes-agent/releases/latest --jq '.tag_name')"
          fi
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || exit 1
          gh api "repos/NousResearch/hermes-agent/git/ref/tags/$tag" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$FORCE" != 'true' ]] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  build:
    if: needs.check.outputs.publish == 'true'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, suite: noble, ubuntu_version: '24.04', arch: amd64 }
          - { runner: ubuntu-24.04-arm, suite: noble, ubuntu_version: '24.04', arch: arm64 }
          - { runner: ubuntu-26.04, suite: resolute, ubuntu_version: '26.04', arch: amd64 }
          - { runner: ubuntu-26.04-arm, suite: resolute, ubuntu_version: '26.04', arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ needs.check.outputs.tag }}
          path: hermes-agent
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve exact upstream commit
        id: revision
        working-directory: hermes-agent
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3 dpkg-dev fakeroot libx11-dev libxi-dev
      - name: Build upstream Light variant
        working-directory: hermes-agent
        env:
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          # Upstream stable --tag builds require protected internal release-claim metadata.
          # Our third-party build uses the immutable upstream commit instead.
          # Upstream currently prepares only AppImage on Linux; we need both.
          # First generate its validated native tools, then regenerate the packaging
          # input manifest using the upstream packager's own --format flags.
          python3 scripts/bundles/desktop.py --commit "${{ steps.revision.outputs.sha }}" --variant light --prepare-only
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from scripts.bundles.desktop_prepare import PreparedDesktop, fingerprint

          prepared_path = Path(".build/desktop-job/prepared.json").resolve()
          prepared = PreparedDesktop.load(prepared_path)
          packager = prepared.packager
          node = prepared.node
          cmd = [
              str(node), "apps/desktop/scripts/prepare-packaging-tools.mjs",
              "--source", str(Path.cwd()), "--out", str(packager.parent),
              "--cache", str(prepared.request.cache / "packager"),
              "--target", prepared.request.target,
              "--format", "AppImage", "--format", "deb"
          ]
          subprocess.run(cmd, check=True)

          # Electron Builder's icon-tool.js is CommonJS. Its toolset gets copied
          # beneath apps/desktop/ where package.json declares type=module.
          # Place a local CommonJS package scope in the prepared icons toolset
          # so require() works after the builder copies it. Do not modify the
          # upstream source checkout or the locked third-party JS dependencies.
          icons_dir = packager.parent / "icons"
          icon_tool = icons_dir / "icon-tool.js"
          if not icon_tool.is_file():
              raise FileNotFoundError(f"Expected prepared icon tool: {icon_tool}")
          (icons_dir / "package.json").write_text(
              '{"private":true,"type":"commonjs"}\\n'.replace('\\n', '\n'),
              encoding="utf-8",
          )

          # Both nested and enclosing upstream preparation receipts are
          # SHA-256 attested. Refresh ONLY the icon toolset digest, using
          # upstream's real treeDigest algorithm, before the build admission.
          manifest = json.loads(packager.read_text(encoding="utf-8"))
          if Path(manifest["toolsets"]["icons"]).resolve() != icons_dir.resolve():
              raise ValueError("Prepared icons directory does not match manifest")
          digest = subprocess.check_output(
              [
                  str(node), "--input-type=module", "-e",
                  "import {treeDigest} from './apps/desktop/scripts/prepared-packaging.mjs'; "
                  "console.log(treeDigest(process.argv[1]))",
                  str(icons_dir),
              ],
              cwd=Path.cwd(), text=True,
          ).strip()
          updates = 0
          for entry in manifest["files"]:
              if Path(entry["path"]).resolve() == icons_dir.resolve():
                  entry["digest"] = digest
                  updates += 1
          if updates != 1:
              raise ValueError(f"Expected exactly one icon digest entry; got {updates}")
          packager.write_text(json.dumps(manifest, indent=2) + "\\n".replace('\\n', '\n'), encoding="utf-8")

          # The enclosing preparation receipt also records the packager's digest.
          prepared.digests[str(packager)] = fingerprint(packager)
          prepared.write(prepared_path)
          PY
          # Upstream commit packaging normally suffixes the app identity with its
          # SHA. A stable APT package must keep the same appId and userData across
          # releases. Override ONLY the build-time brand environment, while the
          # preparation receipt continues to verify the exact upstream commit.
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          from scripts.bundles import desktop, desktop_inputs
          from scripts.bundles.desktop_prepare import PreparedDesktop

          tag = os.environ["UPSTREAM_TAG"]
          version = tag.removeprefix("v")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise ValueError(f"Only stable upstream releases are supported: {tag}")

          prep = Path(".build/desktop-job/prepared.json").resolve()
          original_build_environment = desktop_inputs.build_environment

          def stable_light_environment(*args, **kwargs):
              env = original_build_environment(*args, **kwargs)
              env.pop("HERMES_BUILD_COMMIT", None)
              env["HERMES_PAYLOAD_TAG"] = tag
              env["HERMES_PAYLOAD_VERSION"] = version
              env["GITHUB_REF_NAME"] = tag
              return env

          desktop_inputs.build_environment = stable_light_environment
          prepared = PreparedDesktop.load(prep)
          env = stable_light_environment(prepared, "light", os.environ)
          subprocess.run(
              [str(prepared.node), "-e",
               "const x=require('./apps/desktop/product-identity.cjs'); "
               "if(x.appId!=='com.nousresearch.hermes-light' || !x.light) "
               "process.exit(2); console.log(x.displayName,x.appId)"],
              env=env, cwd=Path.cwd(), check=True,
          )

          # Use the oldest supported Ubuntu baseline for the portable
          # AppImages. Ubuntu 26.04 jobs need only the native Debian target.
          targets = ["AppImage", "deb"] if os.environ["SUITE"] == "noble" else ["deb"]
          desktop.build_prepared(prep, [
              "--linux", *targets, f"-c.extraMetadata.version={version}"
          ])
          PY
      - name: Normalize Debian metadata
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          UBUNTU_VERSION: ${{ matrix.ubuntu_version }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(hermes-agent/apps/desktop/release/*.deb)
          (( ${#debs[@]} == 1 )) || { echo "Expected one .deb; got ${#debs[@]}" >&2; exit 1; }
          [[ "$(dpkg-deb -f "${debs[0]}" Architecture)" == "$ARCH" ]]
          version="${UPSTREAM_TAG#v}+ubuntu${UBUNTU_VERSION}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+ubuntu(24\.04|26\.04)$ ]] || exit 1
          mkdir -p unpacked dist
          dpkg-deb --raw-extract "${debs[0]}" unpacked
          sed -i -E -e 's/^Package: .*/Package: hermes-desktop-light/' -e "s/^Version: .*/Version: ${version}/" unpacked/DEBIAN/control
          dpkg-deb --root-owner-group --build unpacked "dist/hermes-desktop-light_${version}_${ARCH}.deb"
          [[ "$(dpkg-deb -f dist/*.deb Package)" == 'hermes-desktop-light' ]]
      - name: Smoke test installation
        run: |
          sudo apt-get install -y ./dist/*.deb
          dpkg-query -W hermes-desktop-light
      - name: Stage portable AppImage
        if: matrix.suite == 'noble'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(hermes-agent/apps/desktop/release/*.AppImage)
          (( ${#images[@]} == 1 )) || { echo "Expected one AppImage on Ubuntu 24.04, got ${#images[@]}" >&2; exit 1; }
          install -m 0755 "${images[0]}" "dist/hermes-desktop-light_${UPSTREAM_TAG#v}_linux_${ARCH}.AppImage"
          test -s "dist/hermes-desktop-light_${UPSTREAM_TAG#v}_linux_${ARCH}.AppImage"
      - uses: actions/upload-artifact@v6
        if: matrix.suite == 'noble'
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v7
        with:
          pattern: appimage-*
          merge-multiple: true
          path: dist
      - name: Install signing and APT tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg
      - name: Generate signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: bash scripts/publish-apt.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          files=(dist/*.deb dist/*.AppImage dist/SHA256SUMS)
          if gh release view "$UPSTREAM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$UPSTREAM_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$UPSTREAM_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Hermes Desktop Light $UPSTREAM_TAG (unofficial)" \
              --notes "Community-built Hermes Light for Ubuntu 24.04/26.04 (deb, amd64/arm64) plus portable AppImages built on Ubuntu 24.04 (amd64/arm64). Unofficial, not affiliated with Nous Research."
          fi
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "Packages: https://github.com/$GITHUB_REPOSITORY/releases/tag/$UPSTREAM_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Check Pages enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled. Enable Settings > Pages > Source: GitHub Actions, then manually run this workflow with force=true to deploy APT."
            echo "### APT not yet deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Enable GitHub Pages (Source: GitHub Actions), then run this workflow with **force=true** to publish the signed APT repository." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v6
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: site
      - name: Deploy APT repository
        if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v5
